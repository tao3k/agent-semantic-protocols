# Declarative external provider & analyzer package manifest for ASP.
# Replaces `.gitmodules` so Rust/Cargo consumers (e.g. Marlin) never clone
# unrelated external language providers or private analyzers during `cargo build`.
#
# Usage (Rust hosts embed `agent_semantic_schema_manager::provider_workspace` directly;
# developer shell & CI use Justfile / stdlib `scripts/providers_sync.py`):
#   just providers-sync            # or: python3 scripts/providers_sync.py sync --workspace . --profile core
#   just providers-status          # or: python3 scripts/providers_sync.py status --workspace . --profile all
#   just providers-link-local      # or: python3 scripts/providers_sync.py link-local --workspace . --profile core --ghq-root "$HOME/ghq"
#   just providers-lock            # or: python3 scripts/providers_sync.py lock --workspace . --profile core

schema_version = 1

[profiles]
core = [
    "asp-rust",
    "asp-typescript",
    "asp-python",
    "asp-julia",
    "asp-gerbil-scheme",
]
analyzers = [
    "wendao-graph",
    "science-research",
    "asp-graphs-search",
]
docs = [
    "org",
]
all = [
    "asp-rust",
    "asp-typescript",
    "asp-python",
    "asp-julia",
    "asp-gerbil-scheme",
    "wendao-graph",
    "science-research",
    "asp-graphs-search",
    "org",
]

[packages.asp-rust]
kind = "language-provider"
language = "rust"
repo = "https://github.com/tao3k/asp-rust"
rev = "2420cd7c38bc41bd999bee5876f3d205867968ef"
path = "languages/asp-rust"
transport = "native-or-grpc"
visibility = "public"
optional = false

[packages.asp-typescript]
kind = "language-provider"
language = "typescript"
repo = "https://github.com/tao3k/asp-typescript"
rev = "b030a7d548812a8ff99dc817ee2dd8f24dbc2829"
path = "languages/asp-typescript"
transport = "grpc"
visibility = "public"
optional = false

[packages.asp-python]
kind = "language-provider"
language = "python"
repo = "https://github.com/tao3k/asp-python"
rev = "e69fbe05343fe0ec60b9d3c716fa6abf3e4401c3"
path = "languages/asp-python"
transport = "grpc"
visibility = "public"
optional = false

[packages.asp-julia]
kind = "language-provider"
language = "julia"
repo = "https://github.com/JuliaCN/AspJulia.jl"
rev = "a2018aca0b37abd8b6fe48fa274ed4091eb018d4"
path = "languages/AspJulia.jl"
transport = "grpc"
visibility = "public"
optional = false

[packages.asp-gerbil-scheme]
kind = "language-provider"
language = "gerbil-scheme"
repo = "https://github.com/tao3k/asp-gerbil-scheme"
rev = "18bac5d3a99b7ae17793175d90743ac5db421052"
path = "languages/asp-gerbil-scheme"
transport = "grpc"
visibility = "public"
optional = false

[packages.wendao-graph]
kind = "analyzer"
repo = "https://github.com/tao3k/WendaoGraph.jl"
rev = "ff07e69b9119987f57e4250758c93d40a36ed3e2"
path = "analyzers/WendaoGraph.jl"
transport = "local-library"
visibility = "private"
optional = true

[packages.science-research]
kind = "analyzer"
repo = "https://github.com/tao3k/ScienceResearch.jl"
rev = "e8016f84189fc6e376f374c2582c81db32add9f8"
path = "analyzers/ScienceResearch.jl"
transport = "local-library"
visibility = "public"
optional = true

[packages.asp-graphs-search]
kind = "analyzer"
repo = "https://github.com/tao3k/AspGraphsSearch.jl"
rev = "382a1f8f17eb0387d0f3f65fb75bb416444bc86a"
path = "analyzers/AspGraphsSearch.jl"
transport = "local-library"
visibility = "public"
optional = true

[packages.org]
kind = "docs"
repo = "https://github.com/tao3k/org"
rev = "acb8e084d18fd3871700e6e4e14dd462ef47d28c"
path = "org"
transport = "docs"
visibility = "public"
optional = true
