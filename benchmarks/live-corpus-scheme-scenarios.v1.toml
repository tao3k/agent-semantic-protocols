schema_id = "agent.semantic-protocols.live-corpus-scheme-scenario-suite"
schema_version = "1"
lock_path = "benchmarks/large-library-runtime-corpora.json"
resident_sample_count = 128
sequential_sample_count = 10
concurrent_sample_count = 32
failure_injections = ["cancel-before-terminal", "bounded-mailbox-saturation", "stale-content-binding"]
required_languages = ["gerbil-scheme", "julia", "md", "org", "python", "rust", "typescript"]

[client_protocol]
protocol_id = "agent.semantic-protocols.client"
protocol_version = "1"
transport = "grpc-tokio-streams"
workspace_scheduling = "tokio-join-set"
session_policy = "one-initialize-per-session"
phases = ["initialize", "catalog", "request", "cancel", "cancelled", "shutdown"]
required_telemetry_events = ["client_protocol_initialize", "client_protocol_catalog", "client_protocol_request", "client_protocol_cancel", "client_protocol_cancelled", "client_protocol_shutdown"]
ready_effects = ["mpsc", "oneshot", "cancel", "response"]
forbidden_ready_effects = ["process", "filesystem", "dbWrite", "generationMutation", "providerActivation", "controlPoll"]
applies_to_case_count = 17
maximum_resident_micros = 1000
non_ready_dispatch_count = 0
residual_task_count = 0
p50_maximum_micros = 250
p99_maximum_micros = 700
max_maximum_micros = 1000

[[cache_states]]
state = "cold-build"
prepare_action = "new-isolated-workspace-generation"
mutation_scope = "benchmark-workspace-generation"
sample_count = 1

[[cache_states]]
state = "cold-load"
prepare_action = "evict-resident-generation-only"
mutation_scope = "benchmark-workspace-generation"
sample_count = 10

[[cache_states]]
state = "warm-read"
prepare_action = "reuse-exact-resident-generation"
mutation_scope = "none"
sample_count = 128

[[cache_states]]
state = "released"
prepare_action = "release-exact-benchmark-generation"
mutation_scope = "benchmark-workspace-generation"
sample_count = 1

[[cases]]
case_id = "gerbil-scheme.gerbil.core"
resource_id = "gerbil-scheme.gerbil"
scenario_id = "gerbil-scheme.gerbil-intent-matrix"
language_id = "gerbil-scheme"
provider_id = "asp-gerbil-scheme"
scenario_classes = ["regex-truth", "exact-parser-owner", "zero-match"]
minimum_candidates = 1
maximum_search_micros = 500000
maximum_resident_query_micros = 1000
required_telemetry_events = ["runtime_resident_search_terminal", "runtime_query_playbook_terminal"]
search = '''(search (producers (language gerbil-scheme)) (rg "-n" "-F" "-e" "def" "-e" "import"))'''
zero_match_search = '''(search (producers (language gerbil-scheme)) (rg "-n" "-F" "asp_live_corpus_zero_match_gerbil_7c02"))'''
source_query = '''(query (producers (language gerbil-scheme)) (select (selectors {{selector}}) (projection source) (output json)))'''
callable_skeleton_query = '''(query (producers (language gerbil-scheme)) (select (selectors {{selector}}) (projection callable-skeleton) (output json)))'''

