schema_id = "agent.semantic-protocols.live-corpus-agent-org-topology-scenario-suite"
schema_version = "1"
prompt_contract = "Analyze only the exact source and callable-skeleton evidence in this packet. Return one Agent Org Topology Contribution V1 with a concise summary, a valid Org document, and typed relationships touching the selected scope. Do not infer from filenames or mutate the base Search topology."

[[cases]]
case_id = "gerbil-scheme.gerbil.core"
resource_id = "gerbil-scheme.gerbil"
reasoning_focus = "Explain the selected Gerbil definition's module and import role."
required_relation_kinds = ["defined-in", "imports-from"]
minimum_composed_candidates = 2
composed_search = '''(search (producers (language gerbil-scheme)) (chain (intersect (rg "-n" "def|import" ".") (rg "-n" "-F" "def" ".") (tantivy "title:\"def import\"^2 OR body:def") (tantivy "body:import OR title:def^2"))))'''
multi_source_query = '''(query (producers (language gerbil-scheme)) (select (selectors {{selectors}}) (projection source) (output json)))'''
multi_callable_skeleton_query = '''(query (producers (language gerbil-scheme)) (select (selectors {{selectors}}) (projection callable-skeleton) (output json)))'''

