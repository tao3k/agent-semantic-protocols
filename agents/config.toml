schema_id = "agent.semantic-protocols.agent-route-registry"
schema_version = 1

[platforms.codex]
matcher = "*_codex.toml"

[platforms.claude]
matcher = "*_claude.md"

[agents.asp_explorer]
session_lifetime = "resident"
focus_mode = "leaf"
roles = ["explore", "subagent"]

[agents.asp_testing]
session_lifetime = "resident"
focus_mode = "leaf"
roles = ["build", "subagent", "testing"]
