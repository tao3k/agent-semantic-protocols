name: Large Library Runtime Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: large-library-runtime-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve V1 corpus matrix
    runs-on: ubuntu-latest
    outputs:
      corpora: ${{ steps.corpora.outputs.corpora }}
    steps:
      - uses: actions/checkout@v4
      - id: corpora
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: [.corpora[] | {resource: .resourceId, language: .language}]}' benchmarks/large-library-runtime-corpora.json)"
          echo "corpora=$matrix" >> "$GITHUB_OUTPUT"

  benchmark:
    name: V1 ${{ matrix.resource }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.corpora) }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated benchmark state home
        shell: bash
        run: echo "ASP_STATE_HOME=$RUNNER_TEMP/asp-state-home" >> "$GITHUB_ENV"

      - name: Checkout provider catalog submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            languages/asp-rust \
            languages/asp-typescript \
            languages/asp-python \
            languages/AspJulia.jl \
            languages/asp-gerbil-scheme \
            languages/orgize \
            org

      - name: Install Nix for the project direnv environment
        uses: cachix/install-nix-action@v31

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        if: ${{ matrix.language == 'typescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: languages/asp-typescript/package-lock.json

      - name: Set up Python and uv
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        if: ${{ matrix.language == 'python' }}
        with:
          enable-cache: true

      - name: Set up Julia
        if: ${{ matrix.language == 'julia' }}
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Publish the client and selected provider
        shell: bash
        run: |
          set -euo pipefail
          ./.devenv/devenv-profile-exec just agent-tools-install-client
          case "${{ matrix.language }}" in
            rust) ./.devenv/devenv-profile-exec just agent-tools-install-rs ;;
            typescript) ./.devenv/devenv-profile-exec just agent-tools-install-ts ;;
            python) ./.devenv/devenv-profile-exec just agent-tools-install-py ;;
            julia) ./.devenv/devenv-profile-exec just agent-tools-install-julia ;;
            gerbil-scheme) ./.devenv/devenv-profile-exec just agent-tools-install-gerbil ;;
            md|org) ;;
            *) echo "unsupported Live Corpus language: ${{ matrix.language }}" >&2; exit 2 ;;
          esac

      - name: Run isolated V1 Live Corpus qualification
        shell: bash
        run: |
          set -euo pipefail
          ./.devenv/devenv-profile-exec just check-live-corpus-search-query-resource "${{ matrix.resource }}"

      - name: Upload benchmark receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-corpus-v1-${{ matrix.resource }}-${{ github.run_id }}
          path: ${{ env.ASP_STATE_HOME }}/resources/live-corpus/receipts/search-query-qualification/by-resource/${{ matrix.resource }}.json
          if-no-files-found: warn
