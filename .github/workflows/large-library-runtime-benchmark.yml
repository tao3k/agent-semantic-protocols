name: Large Library Runtime Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: large-library-runtime-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: V1 Search Runtime Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASP_STATE_HOME: ${{ runner.temp }}/asp-state-home

    steps:
      - uses: actions/checkout@v4

      - name: Checkout provider catalog submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            languages/asp-rust \
            languages/typescript-lang-project-harness \
            languages/python-lang-project-harness \
            languages/JuliaLangProjectHarness.jl \
            languages/gerbil-scheme-language-project-harness \
            languages/orgize

      - name: Install Nix for the project direnv environment
        uses: cachix/install-nix-action@v31

      - name: Install direnv
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes direnv
          direnv allow "$GITHUB_WORKSPACE"
          direnv exec . true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: languages/typescript-lang-project-harness/package-lock.json

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Build, publish, and activate every registered corpus provider
        shell: bash
        run: |
          set -euo pipefail
          direnv exec . just agent-tools-install-global \
            "$ASP_STATE_HOME/runtime/bin"

      - name: Enforce V1 1193-owner Turso cold-write gate
        shell: bash
        run: |
          set -euo pipefail
          direnv exec . cargo test --release \
            -p agent-semantic-client-db \
            source_index_1193_owner_cold_write_stays_inside_v1_gate \
            -- --test-threads=1

      - name: Materialize pinned large-library corpora
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.corpora[].resourceId' \
            benchmarks/large-library-runtime-corpora.v1.json | \
            while IFS= read -r resource_id; do
              sync_receipt="$(
                "$ASP_STATE_HOME/runtime/bin/asp" live-corpus sync \
                  --resource "$resource_id" \
                  --lock benchmarks/large-library-runtime-corpora.v1.json \
                  --json
              )"
              checkout_path="$(jq -r '.checkoutPath' <<<"$sync_receipt")"
              "$ASP_STATE_HOME/runtime/bin/asp" live-corpus materialize \
                --resource "$resource_id" \
                --source "$checkout_path" \
                --lock benchmarks/large-library-runtime-corpora.v1.json
            done

      - name: Run V1 registered-corpus search command matrix
        shell: bash
        run: |
          set -euo pipefail
          direnv exec . env UV_CACHE_DIR="$PWD/.cache/uv" \
            just benchmark-large-library-search-runtime-baseline

      - name: Upload benchmark receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: large-library-runtime-search-v1-${{ github.run_id }}
          path: .cache/large-library-runtime-search.v1.receipt.json
          if-no-files-found: warn
