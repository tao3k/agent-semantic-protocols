name: Rust package tests

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-fixtures:
    name: Build shared Runtime test fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout provider catalog submodules
        run: |
          git submodule update --init --depth 1 \
            languages/asp-rust \
            languages/asp-gerbil-scheme \
            org \
            languages/orgize \
            languages/asp-typescript \
            languages/asp-python \
            languages/AspJulia.jl

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: languages/asp-typescript/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure shared compiler cache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Build provider fixtures once
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$PWD"
          mkdir -p .bin
          cargo build --bin asp
          install -m 755 target/debug/asp .bin/asp
          cargo build --manifest-path languages/asp-rust/Cargo.toml --features provider-server --bin asp-rust
          install -m 755 languages/asp-rust/target/debug/asp-rust .bin/asp-rust
          npm --prefix languages/asp-typescript ci
          npm --prefix languages/asp-typescript run build
          cat > .bin/asp-python <<EOF
          #!/usr/bin/env bash
          exec uv run --project "$repo_root/languages/asp-python" --frozen asp-python "\$@"
          EOF
          cat > .bin/asp-typescript <<EOF
          #!/usr/bin/env bash
          exec node "$repo_root/languages/asp-typescript/dist/src/cli/main.js" "\$@"
          EOF
          cat > .bin/asp-julia <<'EOF'
          #!/usr/bin/env bash
          echo "asp-julia is validated outside the Rust package-test matrix" >&2
          exit 127
          EOF
          cat > .bin/asp-gerbil-scheme <<'EOF'
          #!/usr/bin/env bash
          echo "asp-gerbil-scheme is validated by the Gerbil language CI job" >&2
          exit 127
          EOF
          chmod 755 .bin/*

      - name: Publish shared fixtures
        uses: actions/upload-artifact@v4
        with:
          name: rust-runtime-test-fixtures
          path: |
            .bin/
            languages/asp-typescript/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: sccache summary
        if: ${{ always() }}
        run: sccache --show-stats || true

  package-test:
    name: Test ${{ matrix.package }}
    needs: test-fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        package:
          - agent-semantic-artifacts
          - agent-semantic-client
          - agent-semantic-client-core
          - agent-semantic-client-db
          - agent-semantic-client-protocol
          - agent-semantic-client-server
          - agent-semantic-config
          - agent-semantic-content-identity
          - agent-semantic-context-product
          - agent-semantic-hook
          - agent-semantic-hook-testkit
          - agent-semantic-http-json
          - agent-semantic-loop
          - agent-semantic-mrr
          - agent-semantic-provider-protocol
          - agent-semantic-provider-transport
          - agent-semantic-runtime
          - agent-semantic-runtime-server
          - agent-semantic-schema-manager
          - agent-semantic-scheme-syntax
          - agent-semantic-search
          - agent-semantic-search-playbook
          - agent-semantic-search-projection
          - agent-semantic-shell-parser
          - agent-semantic-topology
          - agent-semantic-tree-sitter
          - agent-semantic-workspace-scheduler
          - asp-rust-project-harness-policy

    steps:
      - uses: actions/checkout@v6

      - name: Checkout provider catalog submodules
        run: |
          git submodule update --init --depth 1 \
            languages/asp-rust \
            languages/asp-gerbil-scheme \
            org \
            languages/orgize \
            languages/asp-typescript \
            languages/asp-python \
            languages/AspJulia.jl

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure shared compiler cache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Restore shared Runtime test fixtures
        uses: actions/download-artifact@v5
        with:
          name: rust-runtime-test-fixtures
          path: .

      - name: Restore package-local Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-package-${{ matrix.package }}
          cache-on-failure: true

      - name: Test package
        shell: bash
        run: |
          chmod 755 .bin/*
          cargo test -p "${{ matrix.package }}" --all-targets --all-features

      - name: sccache summary
        if: ${{ always() }}
        run: sccache --show-stats || true
