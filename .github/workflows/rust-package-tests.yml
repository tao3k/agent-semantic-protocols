name: Rust package tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package-test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        package:
          - agent-semantic-artifacts
          - agent-semantic-client-protocol
          - agent-semantic-config
          - agent-semantic-content-identity
          - agent-semantic-http-json
          - agent-semantic-provider-protocol
          - agent-semantic-provider-transport
          - agent-semantic-schema-manager
          - agent-semantic-search
          - agent-semantic-search-playbook
          - agent-semantic-search-projection
          - agent-semantic-topology
          - agent-semantic-workspace-scheduler
          - asp-rust-project-harness-policy

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore package-local Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-package-${{ matrix.package }}
          cache-on-failure: true

      - name: Sync core external providers from providers.toml
        if: ${{ matrix.package == 'agent-semantic-schema-manager' }}
        run: python3 scripts/providers_sync.py sync --workspace . --profile core

      - name: Lint package
        if: ${{ matrix.package != 'asp-rust-project-harness-policy' }}
        run: cargo clippy -p "${{ matrix.package }}" --all-targets --all-features -- -D warnings

      - name: Test package
        if: ${{ matrix.package != 'asp-rust-project-harness-policy' }}
        run: cargo test -p "${{ matrix.package }}" --all-features

      - name: Lint package-local policy API
        if: ${{ matrix.package == 'asp-rust-project-harness-policy' }}
        run: cargo clippy -p asp-rust-project-harness-policy --all-targets --no-default-features -- -D warnings

      - name: Test package-local policy API
        if: ${{ matrix.package == 'asp-rust-project-harness-policy' }}
        run: cargo test -p asp-rust-project-harness-policy --no-default-features
