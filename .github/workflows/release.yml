name: Release ASP tool bundle

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-14
            target: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe

    env:
      ASP_BINARY: asp
      GRAPH_TURBO_RESIDENT_BINARY: asp-graph-turbo-resident
      RELEASE_BUNDLE: asp-tools
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Ensure release tag checkout
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --force "${RELEASE_TAG}"

      - name: Checkout local language dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            languages/rust-lang-project-harness \
            languages/gerbil-scheme-language-project-harness \
            languages/org \
            languages/orgize \
            languages/typescript-lang-project-harness \
            languages/python-lang-project-harness \
            languages/JuliaLangProjectHarness.jl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Build atomic ASP and Graph Turbo release bundle
        shell: bash
        run: just build-asp-release-bundle package

      - name: Smoke bundle
        shell: bash
        run: |
          set -euo pipefail

          "./package/${ASP_BINARY}${{ matrix.exe }}" guide >/dev/null

          env -i PATH="${PATH}" \
            "./package/${GRAPH_TURBO_RESIDENT_BINARY}.bundle/${GRAPH_TURBO_RESIDENT_BINARY}${{ matrix.exe }}" \
            </dev/null >/dev/null

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          asset="${RELEASE_BUNDLE}-${{ matrix.target }}.tar.gz"
          tar -czf "${asset}" -C package .
          python - <<'PY'
          import hashlib
          import os

          asset = f"{os.environ['RELEASE_BUNDLE']}-${{ matrix.target }}.tar.gz"
          digest = hashlib.sha256(open(asset, "rb").read()).hexdigest()
          with open(f"{asset}.sha256", "w", encoding="utf-8") as handle:
              handle.write(f"{digest}  {asset}\n")
          PY

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset="${RELEASE_BUNDLE}-${{ matrix.target }}.tar.gz"
          gh release upload "${RELEASE_TAG}" "${asset}" "${asset}.sha256" --clobber
