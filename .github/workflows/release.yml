name: Release ASP tool bundle

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-14
            target: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe

    env:
      ASP_BINARY: asp
      RELEASE_BUNDLE: asp-tools
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Ensure release tag checkout
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --force "${RELEASE_TAG}"

      - name: Checkout local language dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            languages/asp-rust \
            languages/asp-gerbil-scheme \
            org \
            languages/orgize \
            languages/asp-typescript \
            languages/asp-python \
            languages/AspJulia.jl

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Build atomic ASP and asp-python-graphs service bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path Cargo.toml --package agent-semantic-client --bin asp
          mkdir -p package/asp-python-graphs.bundle
          install -m 755 target/release/asp${{ matrix.exe }} package/asp${{ matrix.exe }}
          uv build --project packages/python/asp_memory_engine --wheel \
            --out-dir package/asp-python-graphs.bundle
          uv build --project packages/python/asp_python_graphs --wheel \
            --out-dir package/asp-python-graphs.bundle
          service_dir="$PWD/package/asp-python-graphs.bundle"
          environment_dir="${service_dir}/environment"
          python -m venv --copies "${environment_dir}"
          if [[ -x "${environment_dir}/bin/python" ]]; then
            service_python="${environment_dir}/bin/python"
            service_launcher="${service_dir}/asp-python-graphs-service"
            service_arguments_json='["serve", "--socket=${socketPath}"]'
            cat > "${service_launcher}" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bundle_dir="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${bundle_dir}/environment/bin/python" -m asp_python_graphs.service_cli "$@"
          EOF
            chmod 755 "${service_launcher}"
          else
            service_python="${environment_dir}/Scripts/python.exe"
            service_launcher="${service_python}"
            service_arguments_json='["-m", "asp_python_graphs.service_cli", "serve", "--socket=${socketPath}"]'
          fi
          uv pip install --python "${service_python}" \
            packages/python/asp_memory_engine packages/python/asp_python_graphs
          graphs_wheel_path="$(find package/asp-python-graphs.bundle -type f -name 'asp_python_graphs-*.whl' -print -quit)"
          memory_wheel_path="$(find package/asp-python-graphs.bundle -type f -name 'asp_memory_engine-*.whl' -print -quit)"
          test -n "${graphs_wheel_path}"
          test -n "${memory_wheel_path}"
          python - "${service_dir}" "${service_launcher}" "${graphs_wheel_path}" "${memory_wheel_path}" "${service_arguments_json}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          service_dir = pathlib.Path(sys.argv[1])
          launcher = pathlib.Path(sys.argv[2])
          wheel = pathlib.Path(sys.argv[3])
          memory_wheel = pathlib.Path(sys.argv[4])
          entrypoint = json.loads(sys.argv[5])
          files = []
          for path in sorted(service_dir.rglob("*")):
              if not path.is_file() or path.name == "artifact-manifest.v1.json":
                  continue
              files.append(
                  {
                      "path": path.relative_to(service_dir).as_posix(),
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          file_material = json.dumps(files, sort_keys=True, separators=(",", ":"))
          manifest = {
              "schemaId": "agent.semantic-protocols.asp-python-graphs-release-artifact",
              "schemaVersion": "1",
              "artifactKind": "server-managed-service-environment",
              "project": "asp-python-graphs",
              "algorithm": "graph-turbo",
              "launcher": launcher.relative_to(service_dir).as_posix(),
              "launcherSha256": hashlib.sha256(launcher.read_bytes()).hexdigest(),
              "environment": "environment",
              "files": files,
              "bundleSha256": hashlib.sha256(file_material.encode()).hexdigest(),
              "entrypoint": entrypoint,
              "wheels": [wheel.name, memory_wheel.name],
              "publicStandaloneCommand": False,
          }
          (wheel.parent / "artifact-manifest.v1.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Smoke bundle
        shell: bash
        run: |
          set -euo pipefail

          "./package/${ASP_BINARY}${{ matrix.exe }}" guide >/dev/null
          if [[ -x package/asp-python-graphs.bundle/asp-python-graphs-service ]]; then
            service_launcher="$PWD/package/asp-python-graphs.bundle/asp-python-graphs-service"
            service_run_args=(serve --socket)
          else
            service_launcher="$PWD/package/asp-python-graphs.bundle/environment/Scripts/python.exe"
            service_run_args=(-m asp_python_graphs.service_cli serve --socket)
          fi
          test -x "${service_launcher}" || test -f "${service_launcher}"
          python - "${service_launcher}" <<'PY'
          import os
          import pathlib
          import sys

          launcher = pathlib.Path(sys.argv[1]).resolve()
          assert os.access(launcher, os.X_OK) or launcher.suffix == ".cmd"
          PY
          socket_path="$RUNNER_TEMP/asp-python-graphs-release.sock"
          "${service_launcher}" "${service_run_args[@]}" "${socket_path}" >/tmp/asp-python-graphs-release.log 2>&1 &
          service_pid=$!
          trap 'kill "${service_pid}" 2>/dev/null || true' EXIT
          python - "${socket_path}" <<'PY'
          import asyncio
          import grpc
          import sys

          async def main() -> None:
              channel = grpc.aio.insecure_channel(f"unix:{sys.argv[1]}")
              await channel.channel_ready()
              await channel.close()

          asyncio.run(main())
          PY

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          asset="${RELEASE_BUNDLE}-${{ matrix.target }}.tar.gz"
          tar -czf "${asset}" -C package .
          python - <<'PY'
          import hashlib
          import os

          asset = f"{os.environ['RELEASE_BUNDLE']}-${{ matrix.target }}.tar.gz"
          digest = hashlib.sha256(open(asset, "rb").read()).hexdigest()
          with open(f"{asset}.sha256", "w", encoding="utf-8") as handle:
              handle.write(f"{digest}  {asset}\n")
          PY

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset="${RELEASE_BUNDLE}-${{ matrix.target }}.tar.gz"
          gh release upload "${RELEASE_TAG}" "${asset}" "${asset}.sha256" --clobber
