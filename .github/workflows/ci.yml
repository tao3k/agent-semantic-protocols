name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-platform-smoke:
    name: Rust platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Windows Git long paths
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: git config --global core.longpaths true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: asp-rust-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'providers.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}
          restore-keys: |
            asp-rust-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'providers.toml', '.github/workflows/ci.yml') }}-
            asp-rust-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: asp-rust-ci-${{ runner.os }}-${{ hashFiles('providers.toml', 'schemas/provider-register.json', 'schemas/provider-install-register.json') }}
          cache-on-failure: true

      - name: Fetch cargo dependencies
        run: cargo fetch

      - name: Check portable Rust search and protocol libraries
        run: >-
          cargo check
          -p agent-semantic-client-protocol
          -p agent-semantic-provider-protocol
          -p agent-semantic-topology
          -p agent-semantic-search-playbook
          -p agent-semantic-search-projection
          -p agent-semantic-search

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: asp-rust-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'providers.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        shell: bash
        run: sccache --show-stats || true

  shared-contract-gates:
    name: Shared schema and workspace policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: asp-shared-contracts-${{ runner.os }}
          cache-on-failure: true

      - name: Sync core external providers from providers.toml
        run: python3 scripts/providers_sync.py sync --workspace . --profile core

      - name: Sync docs external providers from providers.toml
        run: python3 scripts/providers_sync.py sync --workspace . --profile docs

      - name: ASP Rust workspace policy
        run: >-
          cargo test -p asp-rust-project-harness-policy
          --features workspace-policy
          --test integration_test
          workspace_policy::asp_workspace_source_policy_is_clean
          -- --nocapture

      - name: Root schema gates
        run: |
          uv run --project packages/python --frozen pytest \
            tests/unit/test_semantic_source_location_schema.py \
            tests/unit/test_asp_server_first_architecture_rfc.py \
            tests/unit/test_marlin_host_integration_rfc.py \
            tests/unit/test_docs_rfc_skill_contracts.py \
            tests/unit/test_ci_contract_dag.py \
            tests/unit/test_ci_workflow_contracts.py \
            tests/unit/semantic_query_packet_schema/test_basic.py \
            tests/unit/test_semantic_read_packet_schema.py \
            tests/unit/semantic_native_syntax_fact_index_schema \
            tests/unit/semantic_language_registry_schema \
            -q

  python-provider-gates:
    name: Python provider contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync Python provider from providers.toml
        run: python3 scripts/providers_sync.py sync --workspace . --package asp-python

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python provider schema gates
        run: |
          uv run --project languages/asp-python --frozen --with pytest pytest \
            languages/asp-python/tests/unit/asp_python/test_semantic_language_schemas.py \
            -q

      - name: Python provider policy gate
        run: >-
          uv run --project languages/asp-python --frozen python -c
          'from asp_python import assert_asp_python_clean; assert_asp_python_clean(".")'

  catalog-provider-gates:
    name: Catalog and TypeScript provider contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: asp-catalog-contracts-${{ runner.os }}
          cache-on-failure: true

      - name: Sync core external providers from providers.toml
        run: python3 scripts/providers_sync.py sync --workspace . --profile core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: languages/asp-typescript/package-lock.json

      - name: Central schema profile gates
        run: |
          cargo test -p agent-semantic-schema-manager \
            canonical_client_profile_publishes_the_shared_schema_bundle_route \
            --quiet
          cargo test -p agent-semantic-schema-manager \
            canonical_registry_verifies_every_registered_language_bundle \
            --quiet

      - name: TypeScript provider schema gates
        run: |
          npm ci
          npm run build
          node --test \
            dist/tests/unit/semantic_search_schema.test.js \
            dist/tests/unit/semantic_language_registry_read_packet.test.js
        working-directory: languages/asp-typescript

  language-facade-gates:
    name: Cross-language facade contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync core external providers from providers.toml
        run: python3 scripts/providers_sync.py sync --workspace . --profile core

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Language facade smoke gate
        run: uv run --project packages/python --frozen pytest tests/unit/test_language_facade_smoke.py -q
