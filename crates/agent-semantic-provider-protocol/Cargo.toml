[package]
name = "agent-semantic-provider-protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
agent-semantic-config = { path = "../agent-semantic-config" }
schemars.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml.workspace = true
[build-dependencies]
agent-semantic-schema-manager = { path = "../agent-semantic-schema-manager", default-features = false }
serde_json = "1"

[dev-dependencies]
asp-rust.workspace = true

[[test]]
name = "policy"
path = "tests/unit/policy.rs"
