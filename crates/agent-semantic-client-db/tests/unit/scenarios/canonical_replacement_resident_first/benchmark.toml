[benchmark]
id = "canonical-replacement-resident-first-v1"
scenario = "canonical-replacement-resident-first"
clock = "std::time::Instant"
statistic = "resident-publication-elapsed-micros"

[work_metrics]
pointer_metadata_read_count = 1
superseded_payload_decode_count = 0
caller_retry_count = 0
resident_publication_count = 1
epoch_increment = 1

[interpretation]
timing_is_diagnostic = true
work_metrics_are_acceptance_authority = true
durable_commit_is_outside_resident_timing = true
