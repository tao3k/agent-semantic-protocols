[package]
name = "agent-semantic-mrr"
version.workspace = true
edition.workspace = true
description = "ASP maintenance facade for MRR, Ascent closure, GQL, and Scheme AOT program admission."
license.workspace = true

[features]
# POO search integration uses the matching immutable MRR and Data sources.
mrr-data-search-composition = ["dep:mrr-data-core", "dep:mrr-search-kernel"]

[dependencies]
ascent.workspace = true
blake3.workspace = true
gql-catalog.workspace = true
gql-compiler.workspace = true
gql-ir.workspace = true
meta-relational-reasoning.workspace = true
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "0ca825202d4343ca83db8da5d64f48bae21e3013", version = "0.1.0", optional = true, default-features = false }
# POO plan bindings and Data factor types use the same MRR source.
mrr-search-kernel = { package = "meta-relational-reasoning", git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "c202aa2753678c02dc7daafdec853f66f3368a70", version = "0.1.0", optional = true, default-features = false, features = ["worker-inference"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
asp-rust-project-harness-policy.workspace = true

[lints]
workspace = true
