  "item:symbol(dynamic-owner-item-index)",
]
inputs = "inputs"
expected = "expected"
command = "asp gerbil-scheme projection import --owner src/model.ss --workspace .; asp gerbil-scheme search owner src/model.ss items --query dynamic-owner-item-index --workspace . --view seeds; asp gerbil-scheme search owner src/model.ss items --query dynamic-owner-item-index --workspace . --view seeds"
