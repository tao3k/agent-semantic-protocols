[scenario]
id = "query-callable-skeleton-compact-presentation"
title = "Human Query presents callable skeletons without the wire envelope"
package = "agent-semantic-client"
phase = "resident-presentation"
intent = "bind V1 projection identity to one distinct human renderer while preserving complete machine JSON"

[gate]
