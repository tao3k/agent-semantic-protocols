# Optional user hook config.
# Hook defaults are compiled into the runtime; this file exposes the user-level
# overrides that should be easy to audit.
schemaId = "@CLIENT_HOOK_CONFIG_SCHEMA_ID@"
wrapper_match = "enable"
schemaVersion = "@CLIENT_HOOK_CONFIG_SCHEMA_VERSION@"
protocolId = "@HOOK_PROTOCOL_ID@"
protocolVersion = "@HOOK_PROTOCOL_VERSION@"
contractFingerprint = "@HOOK_CLIENT_CONTRACT_FINGERPRINT@"

# ASP replaces this marker with a provider-manifest-derived [[languageProviders]]
# projection when materializing the managed config. Do not maintain extensions here.
# @REGISTERED_LANGUAGE_PROVIDERS@

[agents]

# @AGENT_ROUTES@

[[commandProfiles]]
id = "rust-cargo"
languageIds = ["rust"]

[commandProfiles.categories]
testing = [
  ["cargo", "test"],
  ["cargo", "check"],
  ["cargo", "build"],
  ["just", "test"],
  ["rs-harness", "check"],
]
review = [["cargo", "clippy"], ["cargo", "fmt", "--check"]]

[[commandProfiles]]
id = "typescript-node"
languageIds = ["typescript"]

[commandProfiles.categories]
testing = [
  ["npm", "test"],
  ["npm", "run", "test"],
  ["npm", "run", "build"],
  ["pnpm", "test"],
  ["pnpm", "run", "test"],
  ["pnpm", "run", "build"],
  ["yarn", "test"],
  ["yarn", "build"],
  ["bun", "test"],
  ["bun", "run", "build"],
  ["node", "--test"],
]
review = [
  ["npm", "run", "lint"],
  ["pnpm", "run", "lint"],
  ["yarn", "lint"],
  ["bun", "run", "lint"],
]

[[commandProfiles]]
id = "python-uv"
languageIds = ["python"]

[commandProfiles.categories]
testing = [["pytest"], ["uv", "run", "pytest"]]
review = [["ruff", "check"], ["uv", "run", "ruff", "check"]]

[[commandProfiles]]
id = "julia-pkg"
languageIds = ["julia"]

[commandProfiles.categories]
testing = [["julia", "--project=test"]]

[[commandProfiles]]
id = "c-cmake"
languageIds = ["c", "cpp", "objective-c"]

[commandProfiles.categories]
testing = [["ctest"], ["cmake", "--build"]]

[[commandProfiles]]
id = "gerbil-gxpkg"
languageIds = ["gerbil-scheme"]

[commandProfiles.categories]
testing = [["gxpkg", "test"]]

# Reusable predicates over the normalized AgentAction envelope. Rules compose
# these facts; they do not duplicate tool-name or provider-extension heuristics.
[[actionPolicies]]
id = "registered-language-source"
subjectKindAny = ["registered-language-source", "registered-language-source-pattern"]

[[actionPolicies]]
id = "raw-host-read"
actionAny = ["read"]
effectAny = ["read"]
authorityAny = ["raw-host-action"]

[[actionPolicies]]
id = "raw-host-search"
actionAny = ["search"]
effectAny = ["search"]
authorityAny = ["raw-host-action"]

[[actionPolicies]]
id = "raw-shell-read"
actionAny = ["execute"]
effectAny = ["read"]
authorityAny = ["raw-shell"]

# Registered-language reasoning query/search dispatch. The matcher expands
# `<registered-language>` from the provider registry; the rule owns the complete
# match, intent, decision, and resident dispatch policy.
[[rules]]
id = "registered-asp-reasoning-search"
priority = 100000
intent = "reasoning-search"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Raw search over registered source is denied only in the current Agent; registered source belong in `asp <language> search`. ASP remains available. {{agentSessionInstruction}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "<registered-language>", "search"],
]

[rules.dispatch]
transport = "resident-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "resident-testing-dispatch"
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "This operation is denied only in the current Agent; ASP remains available. {{agentSessionInstruction}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "testing" },
  { profile = "typescript-node", category = "testing" },
  { profile = "python-uv", category = "testing" },
  { profile = "julia-pkg", category = "testing" },
  { profile = "c-cmake", category = "testing" },
  { profile = "gerbil-gxpkg", category = "testing" },
]

[rules.dispatch]
transport = "resident-agent"
role = "testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "testing"

[[rules]]
id = "deny-raw-registered-source-search-action"
enabled = true
event = "pre-tool"
priority = 20000
decision = "deny"
reasonKind = "raw-broad-search"
message = "Raw search over registered source is denied only in the current Agent; registered source belong in `asp <language> search`. ASP remains available. {{agentSessionInstruction}}"

[rules.match]
actionPolicyAll = ["raw-host-search", "registered-language-source"]

[rules.dispatch]
transport = "resident-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "deny-raw-registered-source-action"
priority = 9900
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Raw semantic reads over registered language source are denied. Use parser-owned ASP search/query evidence."
event = "pre-tool"

[rules.match]
actionPolicyAll = ["raw-shell-read", "registered-language-source"]

[[rules.match.effectRules]]
argvPrefix = ["read"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["cat"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["bat"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["head"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["tail"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["sed"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["awk"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["less"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["more"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["git", "show"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["git", "mv"]
effect = "edit"

[[rules.match.effectRules]]
argvPrefix = ["mv"]
effect = "edit"

[[rules.match.effectRules]]
argvPrefix = ["cp"]
effect = "edit"

[[rules.match.authorityRules]]
argvPrefix = ["asp", "<registered-language>"]
authority = "parser-owned-exact-evidence"

[rules.dispatch]
transport = "resident-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "deny-agent-search-json"
priority = 110000
decision = "deny"
reasonKind = "agent-search-json"
decisionMaterializer = "agent-search-json"
message = "Agent-facing search JSON is denied; use the compact ASP search route."

[rules.match]
commandContainsAny = ["--json"]

[[rules]]
id = "materialize-apply-patch-policy"
priority = 1000
decision = "deny"
decisionMaterializer = "apply-patch"
message = "Apply-patch policy is derived by the configured hook materializer."

[[rules]]
id = "materialize-registered-source-read-action"
priority = 40000
decision = "deny"
decisionMaterializer = "source-access"
message = "Registered {{languageId}} source reads are denied. Use the parser-owned ASP route below instead of raw Read."

[rules.match]
actionPolicyAll = ["raw-host-read", "registered-language-source"]

[[rules]]
id = "materialize-structured-document-read-action"
priority = 40010
decision = "deny"
reasonKind = "structured-source-read"
message = "Structured documents require the configured bounded projector: use jq for JSON and yq for TOML."
fields = { capabilityActivation = "lazy-executable", filterGrammar = "bounded-path-v1", jsonBinary = "jq", tomlBinary = "yq", sourceAccessCompactRepeatedMessage = "ASP denied structured source access again. Continue with the configured bounded structured reader (`jq` for JSON, `yq` for TOML); do not retry raw Read." }

[rules.match]
actionAny = ["read"]
effectAny = ["read"]
authorityAny = ["raw-host-action"]
pathGlobAny = ["*.json", "**/*.json", "*.toml", "**/*.toml"]

[[rules]]
id = "materialize-source-access-policy"
priority = 30000
decision = "deny"
decisionMaterializer = "source-access"
message = "Source-access policy is derived by the configured hook materializer."

[rules.match]
[[rules.match.effectRules]]
commandContainsAny = [".read_text(", ".read_bytes(", "read_to_string(", "read_to_end("]
effect = "read"

[[rules.match.effectRules]]
commandContainsAny = ["readFileSync(", ".readFile(", "readFile(", ".text()"]
effect = "read"

[[rules.match.effectRules]]
commandContainsAny = ["open(", ".read("]
effect = "read"

[[rules]]
id = "deny-uncontrolled-source-search-commands"
priority = 10000
decision = "deny"
reasonKind = "raw-broad-search"
message = "Uncontrolled source search is denied. Open the Org-owned interactive ChoicePlane with `asp session --agents choice-plane`."

[rules.dispatch]
transport = "resident-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[rules.match]
argvPrefixAny = [["rg"], ["ag"], ["grep"], ["fd"], ["find"], ["git", "grep"], ["git", "ls-files"]]

[[rules]]
id = "allow-bounded-json-projection"
priority = 20020
decision = "allow"
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "jq"
documentFormat = "json"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionAny = ["-c", "--compact-output", "-r", "--raw-output", "-e", "--exit-status"]
optionValueArity = { "--arg" = 2, "--argjson" = 2, "--slurpfile" = 2, "--rawfile" = 2, "--argfile" = 2, "--indent" = 1, "-L" = 1 }

[[rules]]
id = "allow-bounded-toml-projection"
priority = 20010
decision = "allow"
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "yq"
documentFormat = "toml"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionalSubcommandAny = ["eval", "e"]
optionAny = ["-p=toml"]

[[rules]]
id = "deny-unbounded-structured-projection"
priority = 20000
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Structured documents require one configured bounded projector path; identity, recursive, iterator, compound, unknown-option, multiple-input, and multi-stage projections are denied."

[rules.match]
commandAny = ["jq", "yq"]
argvStructuredDocumentFile = true

[[rules]]
id = "deny-uncontrolled-source-materialization-commands"
priority = 10001
decision = "deny"
decisionMaterializer = "source-access"
reasonKind = "bulk-source-dump"
message = "Direct source materialization is permanently denied. Consume parser-owned ASP evidence; recovery receipts never authorize raw source reads."

[rules.dispatch]
transport = "resident-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[rules.match]
argvPrefixAny = [["cat"], ["sed"], ["head"], ["tail"], ["awk"], ["nl"], ["less"], ["more"], ["bat"], ["strings"], ["xxd"], ["od"], ["cut"], ["sort"], ["uniq"], ["wc"], ["perl"], ["python"], ["python3"], ["ruby"], ["node"], ["dd"], ["jq"], ["yq"]]
argvRegisteredSourceFile = true
actionAny = ["execute"]
effectAny = ["read"]
subjectKindAny = ["registered-language-source", "registered-language-source-pattern"]
authorityAny = ["raw-shell"]

[[rules.match.effectRules]]
argvPrefix = ["cat"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["sed"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["head"]
effect = "read"

