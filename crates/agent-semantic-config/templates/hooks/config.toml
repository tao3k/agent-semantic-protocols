# Optional user hook config.
# Hook defaults are compiled into the runtime; this file exposes the user-level
# overrides that should be easy to audit.
schemaId = "@CLIENT_HOOK_CONFIG_SCHEMA_ID@"
schemaVersion = "@CLIENT_HOOK_CONFIG_SCHEMA_VERSION@"
protocolId = "@HOOK_PROTOCOL_ID@"
protocolVersion = "@HOOK_PROTOCOL_VERSION@"
contractFingerprint = "@HOOK_CLIENT_CONTRACT_FINGERPRINT@"

# Upstream-maintained command semantics. The tree-sitter shell parser emits
# normalized argv stages; this table is the only policy authority that labels
# them. Unknown shapes are not classified at runtime.
[[commandActionPatterns]]
action = "read"
argvPatternAny = [
  ["cat"],
  ["head"],
  ["tail"],
  ["bat", "*"],
  ["batcat", "*"],
  ["less"],
  ["more"],
  ["awk"],
  ["nl"],
  ["Get-Content"],
  ["sed", "-n"],
  # `git` is not a Reader as a whole.  These patterns require the arguments
  # that select source content; their trailing tokens use glob syntax.
  ["git", "show", "*:*.?*"],
  ["git", "diff", "**"],
]

[[commandActionPatterns]]
action = "search"
argvPatternAny = [
  ["rg"], ["rga"], ["ripgrep-all"], ["grep"], ["egrep"], ["fgrep"],
  ["ag"], ["ack"], ["pt"], ["fd"], ["find"], ["git", "grep", "**"],
]

[agentCalling]
defaultPattern = "@{name}"

[agentCalling.platformPatterns]
claude = "@agent-{name-kebab}"

# Generated from schemas/provider-register.json at build time. This list owns
# provider facade routing only; source-extension policy stays in profiles.
@REGISTERED_PROVIDER_ROUTES@

[profiles.rust]
languageId = "rust"
providerId = "asp-rust"
extensionAny = ["rs", "rsx"]
sourceRootAny = ["crates", "languages/asp-rust"]

[profiles.typescript]
languageId = "typescript"
providerId = "asp-typescript"
extensionAny = ["ts", "tsx", "js", "jsx", "mts", "cts", "mjs", "cjs"]
sourceRootAny = ["languages/asp-typescript"]

[profiles.python]
languageId = "python"
providerId = "asp-python"
extensionAny = ["py", "pyi"]
sourceRootAny = ["languages/asp-python"]

[profiles.julia]
languageId = "julia"
providerId = "asp-julia"
extensionAny = ["jl"]
sourceRootAny = ["languages/AspJulia.jl"]

[profiles.gerbil-scheme]
languageId = "gerbil-scheme"
providerId = "asp-gerbil-scheme"
extensionAny = ["ss", "ssi", "scm", "sld"]
sourceRootAny = ["languages/asp-gerbil-scheme"]

[profiles.org]
languageId = "org"
providerId = "asp-org"
extensionAny = ["org"]
sourceRootAny = ["languages/orgize"]

[profiles.markdown]
languageId = "md"
providerId = "asp-md"
extensionAny = ["md", "markdown"]
sourceRootAny = ["docs"]

[[commandProfiles]]
id = "rust-cargo"
languageIds = ["rust"]

[commandProfiles.categories]
testing = [
  ["cargo", "test"],
  ["cargo", "check"],
  ["cargo", "build"],
  ["just", "test"],
  ["asp", "rust", "check"],
]
review = [["cargo", "clippy"]]
format-check = [["cargo", "fmt"]]

[[commandProfiles]]
id = "typescript-node"
languageIds = ["typescript"]

[commandProfiles.categories]
testing = [
  ["npm", "test"],
  ["npm", "run", "test"],
  ["npm", "run", "build"],
  ["pnpm", "test"],
  ["pnpm", "run", "test"],
  ["pnpm", "run", "build"],
  ["yarn", "test"],
  ["yarn", "build"],
  ["bun", "test"],
  ["bun", "run", "build"],
  ["node", "--test"],
]
review = [
  ["npm", "run", "lint"],
  ["pnpm", "run", "lint"],
  ["yarn", "lint"],
  ["bun", "run", "lint"],
]

[[commandProfiles]]
id = "python-uv"
languageIds = ["python"]

[commandProfiles.categories]
testing = [["pytest"], ["uv", "run", "pytest"]]
review = [["ruff", "check"], ["uv", "run", "ruff", "check"]]

[[commandProfiles]]
id = "julia-pkg"
languageIds = ["julia"]

[commandProfiles.categories]
testing = [["julia", "--project=test"]]

[[commandProfiles]]
id = "c-cmake"
languageIds = ["c", "cpp", "objective-c"]

[commandProfiles.categories]
