# Optional user hook config.
# Hook defaults are compiled into the runtime; this file exposes the user-level
# overrides that should be easy to audit.
schemaId = "@CLIENT_HOOK_CONFIG_SCHEMA_ID@"
schemaVersion = "@CLIENT_HOOK_CONFIG_SCHEMA_VERSION@"
protocolId = "@HOOK_PROTOCOL_ID@"
protocolVersion = "@HOOK_PROTOCOL_VERSION@"
contractFingerprint = "@HOOK_CLIENT_CONTRACT_FINGERPRINT@"

# Upstream-maintained deterministic Reader facts. Unknown command shapes are
# observed once by the bounded TMP probe and recorded in the State Home dynamic
# catalog; they are not added to this list at runtime.
readerBehaviorPatterns = [
  ["cat"],
  ["head"],
  ["tail"],
  ["bat"],
  ["grep"],
  ["rg"],
  ["sed", "-n"],
]

[agentCalling]
defaultPattern = "@{name}"

[agentCalling.platformPatterns]
claude = "@agent-{name-kebab}"

# Generated from schemas/provider-register.json at build time. This list owns
# provider facade routing only; source-extension policy stays in profiles.
@REGISTERED_PROVIDER_ROUTES@

[profiles.rust]
languageId = "rust"
providerId = "asp-rust"
extensionAny = ["rs", "rsx"]
sourceRootAny = ["crates", "languages/rust-lang-project-harness"]

[profiles.typescript]
languageId = "typescript"
providerId = "asp-typescript"
extensionAny = ["ts", "tsx", "js", "jsx", "mts", "cts", "mjs", "cjs"]
sourceRootAny = ["languages/typescript-lang-project-harness"]

[profiles.python]
languageId = "python"
providerId = "asp-python"
extensionAny = ["py", "pyi"]
sourceRootAny = ["languages/python-lang-project-harness"]

[profiles.julia]
languageId = "julia"
providerId = "asp-julia"
extensionAny = ["jl"]
sourceRootAny = ["languages/JuliaLangProjectHarness.jl"]

[profiles.gerbil-scheme]
languageId = "gerbil-scheme"
providerId = "asp-gerbil-scheme"
extensionAny = ["ss", "ssi", "scm", "sld"]
sourceRootAny = ["languages/gerbil-scheme-language-project-harness"]

[profiles.org]
languageId = "org"
providerId = "asp-org"
extensionAny = ["org"]
sourceRootAny = ["languages/orgize"]

[profiles.markdown]
languageId = "md"
providerId = "asp-md"
extensionAny = ["md", "markdown"]
sourceRootAny = ["docs"]

[[commandProfiles]]
id = "rust-cargo"
languageIds = ["rust"]

[commandProfiles.categories]
testing = [
  ["cargo", "test"],
  ["cargo", "check"],
  ["cargo", "build"],
  ["just", "test"],
  ["asp", "rust", "check"],
]
review = [["cargo", "clippy"]]
format-check = [["cargo", "fmt"]]

[[commandProfiles]]
id = "typescript-node"
languageIds = ["typescript"]

[commandProfiles.categories]
testing = [
  ["npm", "test"],
  ["npm", "run", "test"],
  ["npm", "run", "build"],
  ["pnpm", "test"],
  ["pnpm", "run", "test"],
  ["pnpm", "run", "build"],
  ["yarn", "test"],
  ["yarn", "build"],
  ["bun", "test"],
  ["bun", "run", "build"],
  ["node", "--test"],
]
review = [
  ["npm", "run", "lint"],
  ["pnpm", "run", "lint"],
  ["yarn", "lint"],
  ["bun", "run", "lint"],
]

[[commandProfiles]]
id = "python-uv"
languageIds = ["python"]

[commandProfiles.categories]
testing = [["pytest"], ["uv", "run", "pytest"]]
review = [["ruff", "check"], ["uv", "run", "ruff", "check"]]

[[commandProfiles]]
id = "julia-pkg"
languageIds = ["julia"]

[commandProfiles.categories]
testing = [["julia", "--project=test"]]

[[commandProfiles]]
id = "c-cmake"
languageIds = ["c", "cpp", "objective-c"]

[commandProfiles.categories]
testing = [["ctest"], ["cmake", "--build"]]

[[commandProfiles]]
id = "gerbil-gxpkg"
languageIds = ["gerbil-scheme"]

[commandProfiles.categories]
testing = [
  ["gxpkg", "test"],
  ["gxtest"],
  ["just", "test-gerbil-provider-http-json"],
  ["just", "check-gerbil-owner-items-fast-path"],
]

[[commandProfiles]]
id = "gerbil-gxi"
languageIds = ["gerbil-scheme"]

[commandProfiles.categories]
building = [["gxi"], ["gxc"]]

[[commandProfiles]]
id = "lean-lake"
languageIds = ["lean"]

[commandProfiles.categories]
testing = [["lake", "env", "lean"], ["lake", "build"]]

# Repository-wide inspection families are independent of language profiles.
# Source-search commands such as `git grep` and `git ls-files` deliberately do
# not belong here; they remain governed by registered-source search routing.
[[commandSets]]
id = "git-history-inspection"
argvPrefixAny = [
  ["git", "log"],
  ["git", "show"],
  ["git", "diff"],
  ["git", "reflog"],
  ["git", "shortlog"],
  ["git", "blame"],
]

# The command-local escape is the second no-agent layer. A parser-proven
# process environment binding bypasses all Hook policy for that Bash process.
[[rules]]
id = "allow-explicit-no-agent"
priority = 200000
matcher = "Bash"
intent = "no-agent"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed an explicitly no-agent process without Hook policy routing."

[rules.match]
processEnvironmentAssignmentAny = ["ASP_NO_AGENT=1"]

[rules.fields]
bypassOwner = "hook-matcher"
bypassScope = "host-policy"
recoveryAuthority = "explicit-no-agent-process"

# Native Host Edit actions with an explicit workspace path receive a stable
# mutation intent. Agent registration profiles remain the authority that may
# admit or deny that intent; this rule does not duplicate agent names.
[[rules]]
id = "allow-owner-scoped-mutation"
priority = 150000
matcher = "^apply_patch$"
intent = "owner-scoped-mutation"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed a path-bearing native Edit action in the registered coding lane."

[rules.match]
pathGlobAny = ["**"]

# Registered-language reasoning search dispatch. The matcher expands
# `<registered-language>` from the provider registry; the rule owns the complete
# match, intent, decision, and Host role-dispatch policy. Exact selector-bearing
# query is the main-thread QueryHandoff materialization boundary and is not
# dispatched back into the Explorer.
[[rules]]
id = "registered-asp-reasoning-search"
matcherPolicies = ["wrapped_command"]
priority = 100000
intent = "reasoning-search"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Registered-source reasoning search is denied only in the current Agent. This policy is owned by Config TOML: delegate search to the registered ASP Explorer, require its exact selector receipt, then materialize that selector from the main thread with `asp <language> query --selector ... --projection source`. The `--json` flag is reserved for explicit debug or programmatic automation, not normal Explorer evidence flow. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "<registered-language>", "search"],
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "registered-asp-structured-projection"
matcherPolicies = ["wrapped_command"]
priority = 100000
intent = "structured-projection"
decision = "deny"
reasonKind = "subagent-receipt-required"
event = "pre-tool"

[rules.match]
argvPatternAny = [["asp", "<registered-language>", "query"]]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "testing-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "This operation is denied only in the current Agent; ASP remains available. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "testing" },
  { profile = "typescript-node", category = "testing" },
  { profile = "python-uv", category = "testing" },
  { profile = "julia-pkg", category = "testing" },
  { profile = "c-cmake", category = "testing" },
  { profile = "gerbil-gxpkg", category = "testing" },
  { profile = "lean-lake", category = "testing" },
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "testing"

[[rules]]
id = "rust-format-check-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 91000
intent = "review-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Rust formatting verification is denied only in the current Agent; run the non-mutating `cargo fmt ... -- --check` form in the ASP Testing lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "format-check" },
]
argvTokenAll = ["--check"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "review"

[[rules]]
id = "review-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "review-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Static review is denied only in the current Agent; run it in the ASP Testing lane and return the typed receipt. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "review" },
  { profile = "typescript-node", category = "review" },
  { profile = "python-uv", category = "review" },
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "review"

[[rules]]
id = "git-history-inspection-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "git-history-inspection"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Git history inspection can emit large repository-object projections. Run this command in the ASP Testing lane and return a compact receipt. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandSetAny = ["git-history-inspection"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "git-history-inspection"

[[rules]]
id = "live-corpus-qualification-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "live-corpus-qualification"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Live Corpus qualification is denied only in the current Agent; run the formal qualification in the ASP Testing execution lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "live-corpus", "qualify"],
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "live-corpus-qualification"

[[rules]]
id = "gerbil-build-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "This Gerbil build is denied only in the current Agent; run it in the ASP Testing execution lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "gerbil-gxi", category = "building" },
]
argvSourceGlobAny = ["*.ss", "**/*.ss"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "building"

[[rules]]
id = "deny-agent-search-json"
matcherPolicies = ["wrapped_command"]
priority = 110000
intent = "reasoning-search"
decision = "deny"
reasonKind = "agent-search-json"
message = "Agent-facing search JSON is denied; use the compact ASP search route."

[rules.match]
argvPatternAny = [
  ["asp", "<registered-language>", "search"],
]
commandContainsAny = ["--json"]

[[rules]]
id = "route-read-to-asp-languages"
priority = 40000
matcher = "Bash"
actions = ["read"]
profilesList = ["rust", "typescript", "python", "julia", "gerbil-scheme", "org", "markdown"]
decision = "deny"
reasonKind = "registered-source-route-required"
message = "Confirmed {{languageId}} source reads are denied. Use the parser-owned ASP route below instead of raw Read."


[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "route-shell-structured-document-read"
actions = ["read"]
priority = 40010
matcher = "Bash"
decision = "deny"
reasonKind = "structured-source-read"
message = "A Shell input redirection reads a structured document. Delegate the JSON/TOML read to the registered ASP Explorer, then use the configured bounded projector there: jq for JSON and yq for TOML."

[rules.match]
pathGlobAny = ["*.json", "**/*.json", "*.toml", "**/*.toml"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "allow-bounded-json-projection"
matcherPolicies = ["wrapped_command"]
priority = 40020
intent = "structured-projection"
decision = "allow"
terminal = true
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "jq"
documentFormat = "json"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionAny = ["-c", "--compact-output", "-r", "--raw-output", "-e", "--exit-status"]
optionValueArity = { "--arg" = 2, "--argjson" = 2, "--slurpfile" = 2, "--rawfile" = 2, "--argfile" = 2, "--indent" = 1, "-L" = 1 }

[[rules]]
id = "allow-bounded-toml-projection"
matcherPolicies = ["wrapped_command"]
priority = 40020
intent = "structured-projection"
decision = "allow"
terminal = true
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "yq"
documentFormat = "toml"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionalSubcommandAny = ["eval", "e"]
optionAny = ["-p=toml"]

[[rules]]
id = "deny-unbounded-structured-projection"
matcherPolicies = ["wrapped_command"]
priority = 40015
intent = "structured-projection"
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Structured documents require one configured bounded projector path; identity, recursive, iterator, compound, unknown-option, multiple-input, and multi-stage projections are denied."

[rules.match]
commandAny = ["jq", "yq"]
argvStructuredDocumentFile = true
