# Repository-wide inspection families are independent of language profiles.
# Source-search commands such as `git grep` and `git ls-files` deliberately do
# not belong here; they remain governed by registered-source search routing.
[[commandSets]]
id = "git-history-inspection"
argvPrefixAny = [
  ["git", "log"],
  ["git", "show"],
  ["git", "diff"],
  ["git", "reflog"],
  ["git", "shortlog"],
  ["git", "blame"],
]

# Codex thread lifecycle and message transport are Host coordination actions,
# not shell commands or generic MCP execution. Keep their native tool names
# exact so policy receipts retain the action that the Host actually invoked.
[[rules]]
id = "allow-codex-thread-control"
priority = 190000
matcher = "mcp__codex_app__create_thread|mcp__codex_app__fork_thread|mcp__codex_app__list_threads|mcp__codex_app__list_archived_threads|mcp__codex_app__read_thread|mcp__codex_app__read_thread_terminal|mcp__codex_app__send_message_to_thread|mcp__codex_app__wait_threads|mcp__codex_app__handoff_thread|mcp__codex_app__get_handoff_status|mcp__codex_app__navigate_to_codex_page|mcp__codex_app__open_in_codex|mcp__codex_app__set_thread_archived|mcp__codex_app__set_thread_pinned|mcp__codex_app__set_thread_title|mcp__codex_app__share_thread"
intent = "host-thread-control"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed an exact Codex thread-control action after native Host matching."

[[rules]]
id = "allow-codex-workspace-observation"
priority = 190000
matcher = "mcp__codex_app__list_projects|mcp__codex_app__load_workspace_dependencies"
intent = "host-workspace-observation"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed an exact Codex workspace-observation action after native Host matching."

[[rules]]
id = "allow-codex-automation-control"
priority = 190000
matcher = "mcp__codex_app__automation_update"
intent = "host-automation-control"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed an exact Codex automation control action; the Host remains the mutation authority."

# Native Host Edit actions with an explicit workspace path receive a stable
# mutation intent. Agent registration profiles remain the authority that may
# admit or deny that intent; this rule does not duplicate agent names.
[[rules]]
id = "allow-owner-scoped-mutation"
priority = 150000
matcher = "apply_patch"
intent = "owner-scoped-mutation"
decision = "allow"
terminal = true
event = "pre-tool"
platform = "codex"
message = "Allowed a path-bearing native Edit action in the registered coding lane."

[rules.match]
pathGlobAny = ["**"]

# Runtime-owned reasoning search dispatch. The public playbook carries its
# producer-set union in `--language`; provider admission remains inside Runtime. The
# rule owns the complete match, intent, decision, and Host role-dispatch policy. Exact selector-bearing
# query is the main-thread QueryHandoff materialization boundary and is not
# dispatched back into the Explorer.
[[rules]]
id = "registered-asp-reasoning-search"
matcherPolicies = ["wrapped_command"]
priority = 100000
intent = "reasoning-search"
decision = "deny"
reasonKind = "agent-choice-required"
message = "The current Agent cannot run this registered-source Search playbook. Delegate the exact `search playbook` request to ASP Explorer. ASP Server will use the admitted rg acquisition, Tantivy lexical, and asp-python-graphs generation. ASP Explorer returns bounded selector evidence without prescribing the parent Agent's next action. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "search", "playbook"],
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "registered-asp-structured-projection"
matcherPolicies = ["wrapped_command"]
priority = 100000
intent = "structured-projection"
decision = "deny"
reasonKind = "agent-choice-required"
event = "pre-tool"

[rules.match]
argvPatternAny = [["asp", "query", "playbook"]]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "testing-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "agent-choice-required"
message = "This operation is denied only in the current Agent; ASP remains available. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "testing" },
  { profile = "typescript-node", category = "testing" },
  { profile = "python-uv", category = "testing" },
  { profile = "julia-pkg", category = "testing" },
  { profile = "c-cmake", category = "testing" },
  { profile = "gerbil-gxpkg", category = "testing" },
  { profile = "lean-lake", category = "testing" },
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "testing"

[[rules]]
id = "rust-format-check-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 91000
intent = "review-command"
decision = "deny"
reasonKind = "agent-choice-required"
message = "Rust formatting verification is denied only in the current Agent; run the non-mutating `cargo fmt ... -- --check` form in the ASP Testing lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "format-check" },
]
argvTokenAll = ["--check"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "review"

[[rules]]
id = "review-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "review-command"
decision = "deny"
reasonKind = "agent-choice-required"
message = "Static review is denied only in the current Agent; run it in the ASP Testing lane and return the typed receipt. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "review" },
  { profile = "typescript-node", category = "review" },
  { profile = "python-uv", category = "review" },
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "review"

[[rules]]
id = "git-history-inspection-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "git-history-inspection"
decision = "deny"
reasonKind = "agent-choice-required"
message = "Git history inspection can emit large repository-object projections. Run this command in the ASP Testing lane and return a compact receipt. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandSetAny = ["git-history-inspection"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "git-history-inspection"

[[rules]]
id = "live-corpus-qualification-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "live-corpus-qualification"
decision = "deny"
reasonKind = "agent-choice-required"
message = "Live Corpus qualification is denied only in the current Agent; run the formal qualification in the ASP Testing execution lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "live-corpus", "qualify"],
]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "live-corpus-qualification"

[[rules]]
id = "gerbil-build-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "agent-choice-required"
message = "This Gerbil build is denied only in the current Agent; run it in the ASP Testing execution lane. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "gerbil-gxi", category = "building" },
]
argvSourceGlobAny = ["*.ss", "**/*.ss"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "building"

[[rules]]
id = "deny-agent-search-json"
matcherPolicies = ["wrapped_command"]
priority = 110000
intent = "reasoning-search"
decision = "deny"
reasonKind = "agent-search-json"
message = "Agent-facing search JSON is denied; use the compact ASP search route."

[rules.match]
argvPatternAny = [
  ["asp", "search", "playbook"],
]
commandContainsAny = ["--json"]

[[rules]]
id = "route-read-to-asp-languages"
priority = 40000
matcher = "Bash"
actions = ["read"]
profilesList = ["rust", "typescript", "python", "julia", "gerbil-scheme"]
decision = "deny"
reasonKind = "registered-source-route-required"
message = "The current Agent cannot read this confirmed {{languageId}} source directly. Delegate the denied read to ASP Explorer and continue from its exact selector receipt. {{agentDispatchMessage}}"


[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "deny-shell-search-before-execution"
priority = 40001
matcher = "Bash"
actions = ["search"]
decision = "deny"
reasonKind = "raw-broad-search"
message = "Direct shell search is denied before execution because Codex renders it as Search. Use the ASP search playbook instead."

[[rules]]
id = "route-org-document-read-to-asp-explorer"
priority = 40000
matcher = "Bash"
actions = ["read"]
profilesList = ["org"]
decision = "deny"
reasonKind = "registered-source-route-required"
message = "The current Agent cannot read this confirmed Org document directly. Delegate it to ASP Explorer through the `asp org` document route and continue from its exact selector receipt. {{agentDispatchMessage}}"

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "route-markdown-document-read-to-asp-explorer"
priority = 40000
matcher = "Bash"
actions = ["read"]
profilesList = ["markdown"]
decision = "deny"
reasonKind = "registered-source-route-required"
message = "Direct Markdown reads are denied because ASP Markdown retrieval must remain selector-bound. Use the registered Markdown Search Playbook route. {{agentDispatchMessage}}"

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "route-shell-structured-document-read"
actions = ["read"]
priority = 40010
matcher = "Bash"
decision = "deny"
reasonKind = "structured-source-read"
message = "A Shell input redirection reads a structured document. Delegate the JSON/TOML read to the registered ASP Explorer, then use the configured bounded projector there: jq for JSON and yq for TOML."

[rules.match]
pathGlobAny = ["*.json", "**/*.json", "*.toml", "**/*.toml"]

[rules.dispatch]
transport = "host-agent"
agent = "asp_explorer"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "allow-bounded-json-projection"
matcherPolicies = ["wrapped_command"]
priority = 40020
intent = "structured-projection"
decision = "allow"
terminal = true
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "jq"
documentFormat = "json"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionAny = ["-c", "--compact-output", "-r", "--raw-output", "-e", "--exit-status"]
optionValueArity = { "--arg" = 2, "--argjson" = 2, "--slurpfile" = 2, "--rawfile" = 2, "--argfile" = 2, "--indent" = 1, "-L" = 1 }

[[rules]]
id = "allow-bounded-toml-projection"
matcherPolicies = ["wrapped_command"]
priority = 40020
intent = "structured-projection"
decision = "allow"
terminal = true
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "yq"
documentFormat = "toml"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionalSubcommandAny = ["eval", "e"]
optionAny = ["-p=toml"]

[[rules]]
id = "deny-unbounded-structured-projection"
matcherPolicies = ["wrapped_command"]
priority = 40015
intent = "structured-projection"
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Structured documents require one configured bounded projector path; identity, recursive, iterator, compound, unknown-option, multiple-input, and multi-stage projections are denied."

[rules.match]
commandAny = ["jq", "yq"]
argvStructuredDocumentFile = true
