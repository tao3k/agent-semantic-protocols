# Optional user hook config.
# Hook defaults are compiled into the runtime; this file exposes the user-level
# overrides that should be easy to audit.
schemaId = "@CLIENT_HOOK_CONFIG_SCHEMA_ID@"
schemaVersion = "@CLIENT_HOOK_CONFIG_SCHEMA_VERSION@"
protocolId = "@HOOK_PROTOCOL_ID@"
protocolVersion = "@HOOK_PROTOCOL_VERSION@"
contractFingerprint = "@HOOK_CLIENT_CONTRACT_FINGERPRINT@"

[profiles.rust]
languageId = "rust"
providerId = "asp-rust"
extensionAny = ["rs", "rsx"]

[profiles.typescript]
languageId = "typescript"
providerId = "asp-typescript"
extensionAny = ["ts", "tsx", "js", "jsx", "mts", "cts", "mjs", "cjs"]

[profiles.python]
languageId = "python"
providerId = "asp-python"
extensionAny = ["py", "pyi"]

[profiles.julia]
languageId = "julia"
providerId = "asp-julia"
extensionAny = ["jl"]

[profiles.gerbil-scheme]
languageId = "gerbil-scheme"
providerId = "asp-gerbil-scheme"
extensionAny = ["ss", "ssi", "scm", "sld"]

[[commandProfiles]]
id = "rust-cargo"
languageIds = ["rust"]

[commandProfiles.categories]
testing = [
  ["cargo", "test"],
  ["cargo", "check"],
  ["cargo", "build"],
  ["just", "test"],
  ["asp", "rust", "check"],
]
review = [["cargo", "clippy"], ["cargo", "fmt", "--check"]]

[[commandProfiles]]
id = "typescript-node"
languageIds = ["typescript"]

[commandProfiles.categories]
testing = [
  ["npm", "test"],
  ["npm", "run", "test"],
  ["npm", "run", "build"],
  ["pnpm", "test"],
  ["pnpm", "run", "test"],
  ["pnpm", "run", "build"],
  ["yarn", "test"],
  ["yarn", "build"],
  ["bun", "test"],
  ["bun", "run", "build"],
  ["node", "--test"],
]
review = [
  ["npm", "run", "lint"],
  ["pnpm", "run", "lint"],
  ["yarn", "lint"],
  ["bun", "run", "lint"],
]

[[commandProfiles]]
id = "python-uv"
languageIds = ["python"]

[commandProfiles.categories]
testing = [["pytest"], ["uv", "run", "pytest"]]
review = [["ruff", "check"], ["uv", "run", "ruff", "check"]]

[[commandProfiles]]
id = "julia-pkg"
languageIds = ["julia"]

[commandProfiles.categories]
testing = [["julia", "--project=test"]]

[[commandProfiles]]
id = "c-cmake"
languageIds = ["c", "cpp", "objective-c"]

[commandProfiles.categories]
testing = [["ctest"], ["cmake", "--build"]]

[[commandProfiles]]
id = "gerbil-gxpkg"
languageIds = ["gerbil-scheme"]

[commandProfiles.categories]
testing = [["gxpkg", "test"]]

# Reusable predicates over the normalized AgentAction envelope. Rules compose
# these facts; they do not duplicate tool-name or provider-extension heuristics.
[[capabilityPolicies]]
id = "registered-language-source"
subjectKindAny = ["registered-language-source", "registered-language-source-pattern"]

[[capabilityPolicies]]
id = "raw-host-search"
actionAny = ["search", "execute"]
semanticCapabilityAny = ["search"]

[[capabilityPolicies]]
id = "opaque-shell-source-access"
actionAny = ["execute"]

# Registered-language reasoning query/search dispatch. The matcher expands
# `<registered-language>` from the provider registry; the rule owns the complete
# match, intent, decision, and Host role-dispatch policy.
[[rules]]
id = "registered-asp-reasoning-search"
matcherPolicies = ["wrapped_command"]
priority = 100000
intent = "reasoning-search"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "Raw search over registered source is denied only in the current Agent. This policy is owned by Config TOML: delegate it to the registered ASP Explorer, which uses the compact `asp <language> search ...` route without `--json`. The `--json` flag is reserved for explicit debug or programmatic automation, not normal Explorer search. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
argvPatternAny = [
  ["asp", "<registered-language>", "search"],
]

[rules.dispatch]
transport = "host-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "testing-role-dispatch"
matcherPolicies = ["wrapped_command"]
priority = 90000
intent = "test-build-command"
decision = "deny"
reasonKind = "subagent-receipt-required"
message = "This operation is denied only in the current Agent; ASP remains available. {{agentDispatchMessage}}"
event = "pre-tool"

[rules.match]
commandProfileAny = [
  { profile = "rust-cargo", category = "testing" },
  { profile = "typescript-node", category = "testing" },
  { profile = "python-uv", category = "testing" },
  { profile = "julia-pkg", category = "testing" },
  { profile = "c-cmake", category = "testing" },
  { profile = "gerbil-gxpkg", category = "testing" },
]

[rules.dispatch]
transport = "host-agent"
role = "testing"
receiptKind = "asp-testing-execution-v1"

[rules.fields]
executionLane = "testing"
blockedCommandClass = "testing"

[[rules]]
id = "deny-raw-registered-source-search-action"
enabled = true
event = "pre-tool"
priority = 20000
decision = "deny"
reasonKind = "raw-broad-search"
message = "Raw search over registered source is denied only in the current Agent; registered source belong in `asp <language> search`. ASP remains available. {{agentDispatchMessage}}"

[rules.match]
capabilityPolicyAll = ["raw-host-search", "registered-language-source"]

[rules.dispatch]
transport = "host-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "deny-raw-registered-source-action"
priority = 9900
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Raw semantic reads over registered language source are denied. Use parser-owned ASP search/query evidence."
event = "pre-tool"
profilesList = ["rust", "typescript", "python", "julia", "gerbil-scheme"]

[rules.match]
capabilityPolicyAll = ["opaque-shell-source-access", "registered-language-source"]

[rules.dispatch]
transport = "host-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[[rules]]
id = "allow-explicit-no-agent-host-bypass"
priority = 200000
decision = "allow"
terminal = true
event = "pre-tool"
message = "Explicit parser-owned no-Agent Host policy bypass."
fields = { bypassOwner = "hook-matcher", bypassScope = "host-policy" }

[rules.match]
leadingEnvironmentAssignmentAny = ["ASP_NO_AGENT=1"]

[[rules]]
id = "deny-agent-search-json"
matcherPolicies = ["wrapped_command"]
priority = 110000
intent = "reasoning-search"
decision = "deny"
reasonKind = "agent-search-json"
message = "Agent-facing search JSON is denied; use the compact ASP search route."

[rules.match]
argvPatternAny = [
  ["asp", "<registered-language>", "search"],
]
commandContainsAny = ["--json"]

[[rules]]
id = "route-read-to-asp-languages"
priority = 40000
actions = ["read"]
profilesList = ["rust", "typescript", "python", "julia", "gerbil-scheme"]
decision = "deny"
message = "Registered {{languageId}} source reads are denied. Use the parser-owned ASP route below instead of raw Read."

[[rules]]
id = "route-structured-document-read"
priority = 40010
actions = ["read"]
decision = "deny"
reasonKind = "structured-source-read"
message = "Raw structured-document Read is denied only in the current Agent. Delegate the native JSON/TOML file read to the registered ASP Explorer, then use the configured bounded projector there: jq for JSON and yq for TOML."

[rules.match]
pathGlobAny = ["*.json", "**/*.json", "*.toml", "**/*.toml"]

[rules.dispatch]
transport = "host-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"

[[rules]]
id = "deny-uncontrolled-source-search-commands"
matcherPolicies = ["wrapped_command"]
priority = 10000
decision = "deny"
reasonKind = "raw-broad-search"
message = "Uncontrolled source search is denied. Open the Org-owned interactive ChoicePlane with `asp session --agents choice-plane`."

[rules.dispatch]
transport = "host-agent"
role = "explore"
receiptKind = "asp-explore-search-v1"
lazyProvider = "matched-language"

[rules.match]
argvPrefixAny = [["rg"], ["ag"], ["grep"], ["fd"], ["find"], ["git", "grep"], ["git", "ls-files"]]

[[rules]]
id = "allow-bounded-json-projection"
matcherPolicies = ["wrapped_command"]
priority = 20020
decision = "allow"
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "jq"
documentFormat = "json"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionAny = ["-c", "--compact-output", "-r", "--raw-output", "-e", "--exit-status"]
optionValueArity = { "--arg" = 2, "--argjson" = 2, "--slurpfile" = 2, "--rawfile" = 2, "--argfile" = 2, "--indent" = 1, "-L" = 1 }

[[rules]]
id = "allow-bounded-toml-projection"
matcherPolicies = ["wrapped_command"]
priority = 20010
decision = "allow"
fields = { projectionGrammar = "bounded-path-v1", capabilityActivation = "lazy-executable" }

[rules.match]
argvWorkspaceRegularFile = true

[rules.match.structuredProjection]
binary = "yq"
documentFormat = "toml"
filterGrammar = "bounded-path-v1"
maxSliceItems = 64
optionalSubcommandAny = ["eval", "e"]
optionAny = ["-p=toml"]

[[rules]]
id = "deny-unbounded-structured-projection"
matcherPolicies = ["wrapped_command"]
priority = 20000
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Structured documents require one configured bounded projector path; identity, recursive, iterator, compound, unknown-option, multiple-input, and multi-stage projections are denied."

[rules.match]
commandAny = ["jq", "yq"]
argvStructuredDocumentFile = true

[[rules]]
id = "deny-uncontrolled-git-metadata-reads"
matcherPolicies = ["wrapped_command"]
priority = 10002
decision = "deny"
reasonKind = "raw-broad-search"
message = "Git metadata and tree reads are denied in the main Agent. Open the Org-owned interactive ChoicePlane with `asp session --agents choice-plane`."

[rules.dispatch]
transport = "host-agent"
role = "testing"
receiptKind = "asp-testing-execution-v1"

[rules.match]
argvPrefixAny = [["git", "show", "--stat"], ["git", "diff", "--stat"], ["git", "diff", "--name-only"], ["git", "diff", "--check"], ["git", "ls-tree"]]

[[rules]]
id = "deny-uncontrolled-git-source-reads"
matcherPolicies = ["wrapped_command"]
priority = 10000
decision = "deny"
reasonKind = "bulk-source-dump"
message = "Git object and diff source materialization is denied in the main Agent. Open the Org-owned interactive ChoicePlane with `asp session --agents choice-plane`."

[rules.dispatch]
transport = "host-agent"
role = "testing"
receiptKind = "asp-testing-execution-v1"

[rules.match]
argvPrefixAny = [["git", "show"], ["git", "diff"], ["git", "cat-file"], ["git", "blame"], ["git", "log"]]
