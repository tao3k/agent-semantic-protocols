effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["xxd"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["od"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["cut"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["sort"]
effect = "read"

[[rules.match.effectRules]]
argvPrefix = ["uniq"]
effect = "read"

[[rules.match.effectRules]]
