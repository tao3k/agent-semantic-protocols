[package]
name = "agent-semantic-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Root semantic agent hook runtime for provider manifests and project activations."
build = "build-support/main.rs"

[features]
default = ["compiler", "evaluator"]
compiler = [
    "dep:agent-semantic-schema-manager",
    "dep:agent-semantic-artifacts",
    "dep:agent-semantic-provider-protocol",
    "dep:agent-semantic-shell-parser",
    "dep:agent-semantic-config",
    "dep:agent-semantic-content-identity",
    "dep:agent-semantic-runtime",
    "dep:blake3",
    "dep:aho-corasick",
    "dep:base64",
    "dep:fs2",
    "dep:globset",
    "dep:memmap2",
    "dep:postcard",
    "dep:regex-automata",
    "dep:regex-syntax",
    "dep:regex",
    "dep:sha2",
    "dep:toml",
    "dep:libc",
    "dep:tokio",
    "dep:which",
]
evaluator = ["dep:agent-semantic-shell-parser", "dep:libc", "dep:which"]

[[bin]]
name = "asp-hook-evaluator"
path = "src/bin/asp_hook_evaluator.rs"
test = false
bench = false
required-features = ["evaluator"]

[build-dependencies]
agent-semantic-schema-manager = { workspace = true, optional = true }

[dependencies]
agent-semantic-artifacts = { workspace = true, optional = true }
agent-semantic-provider-protocol = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
agent-semantic-shell-parser = { path = "../agent-semantic-shell-parser", optional = true }
agent-semantic-config = { path = "../agent-semantic-config", optional = true }
agent-semantic-content-identity = { path = "../agent-semantic-content-identity", optional = true }
agent-semantic-runtime = { path = "../agent-semantic-runtime", optional = true }
aho-corasick = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
regex-automata = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "process", "rt", "time"] }
which = { workspace = true, optional = true }

[dev-dependencies]
asp-rust-project-harness-policy = { path = "../../build-support/asp-rust-project-harness-policy" }
gix.workspace = true
gix-config.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
