[package]
name = "agent-semantic-symbol-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language-neutral, Merkle-bound owner path and parser symbol skeleton index."

[dependencies]
blake3.workspace = true

[[test]]
name = "unit_test"
path = "tests/unit_test.rs"

[build-dependencies]
# This package is an explicit Style-policy atom. Direct ASP Rust ownership
# avoids Cargo feature unification turning every workspace build script into a
# full scanner.
asp-rust.workspace = true
asp-rust-project-harness-policy.workspace = true
blake3.workspace = true
