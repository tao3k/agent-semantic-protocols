[package]
name = "agent-semantic-provider-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tokio process transport for external ASP language providers."

[dependencies]
agent-semantic-provider-protocol.workspace = true
agent-semantic-content-identity.workspace = true
agent-semantic-http-json.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bstr = "1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
libc = "0.2"
memchr = "2"
sha2 = "0.10"
tokio.workspace = true
reqwest = { version = "0.13", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tower.workspace = true
hyper-util.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing = "0.1"

[build-dependencies]
asp-rust-project-harness-policy.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
criterion = "0.8.2"
