[package]
name = "agent-semantic-provider-transport"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Tokio process transport for external ASP language providers."

[features]
default = ["http-client-server"]
http-client-server = ["dep:agent-semantic-http-json", "dep:reqwest"]

[dependencies]
agent-semantic-provider-protocol.workspace = true
agent-semantic-content-identity.workspace = true
agent-semantic-http-json = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bstr = "1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
libc = "0.2"
memchr = "2"
sha2 = "0.10"
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, optional = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[dev-dependencies]
asp-rust.workspace = true
criterion = "0.8.2"

[[bench]]
name = "transport_hot_path"
harness = false

[[test]]
name = "policy"
path = "tests/unit/policy.rs"
