id = "search-subagent-compact-receipt"
title = "ASP search subagents return one Org/GQL graph"
policy_ids = [
  "SEARCH-AGENT-ASP-SUBAGENT-COMPACT-RECEIPT-001",
]
agent_goal = "Keep ASP search subagent success output to exactly one Org-owned GQL source block, free of parallel flat receipts, source bodies, line-range selectors, and prescribed commands."
reference_repositories = ["tao3k/agent-semantic-protocols"]
reference_patterns = [
  "begin_src gql",
  "search-evidence.v1",
  "eval never",
  "SearchResult",
]
inputs = "inputs"
expected = "expected"
command = ".devenv/devenv-profile-exec cargo test -p agent-semantic-hook search_subagent_output_contract --lib -- --nocapture"
