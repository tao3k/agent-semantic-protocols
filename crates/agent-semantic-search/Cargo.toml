[package]
name = "agent-semantic-search"
version = "0.1.0"
edition.workspace = true
description = "Converged sub-millisecond pure-Rust search engine for ASP and Marlin."
license.workspace = true

[features]
default = ["tantivy-accelerator"]
tantivy-accelerator = ["dep:tantivy"]

[dependencies]
agent-semantic-search-playbook = { path = "../agent-semantic-search-playbook" }
agent-semantic-topology.workspace = true
blake3.workspace = true
globset.workspace = true
ignore = { workspace = true }
memchr = "2"
memmap2.workspace = true
rayon = "1.12.0"
regex.workspace = true
regex-syntax.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tantivy = { workspace = true, optional = true }

[dev-dependencies]
asp-rust.workspace = true
criterion.workspace = true
tempfile = { workspace = true }

[[test]]
name = "file_locator"
path = "tests/integration/file_locator.rs"

[[test]]
name = "source_index_lookup_terms"
path = "tests/integration/source_index_lookup_terms.rs"

[[test]]
name = "source_index_rank_performance"
path = "tests/integration/source_index_rank_performance.rs"

[[test]]
name = "marlin_engine_state_machine"
path = "tests/unit/marlin_engine_state_machine.rs"

[[test]]
name = "converged_resident_index_fuzz"
path = "tests/unit/converged_resident_index_fuzz.rs"

[[test]]
name = "resident_symbol_graph"
path = "tests/unit/resident_symbol_graph.rs"

[[bench]]
name = "search_engine_hot_path"
path = "benches/search_engine_hot_path.rs"
harness = false

[[test]]
name = "policy"
path = "tests/unit/policy.rs"
