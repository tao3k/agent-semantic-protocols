[package]
name = "agent-semantic-search"
version = "0.1.0"
edition.workspace = true
description = "Search orchestration services for ASP agent-facing queries."
license.workspace = true

[features]
default = ["tantivy-accelerator"]
tantivy-accelerator = ["dep:tantivy"]

[dependencies]
agent-semantic-client-protocol = { path = "../agent-semantic-client-protocol" }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
agent-semantic-content-identity.workspace = true
agent-semantic-mrr.workspace = true
agent-semantic-shell-parser = { path = "../agent-semantic-shell-parser" }
blake3.workspace = true
globset.workspace = true
agent-semantic-config = { path = "../agent-semantic-config" }
agent-semantic-search-projection = { path = "../agent-semantic-search-projection" }
agent-semantic-tree-sitter = { path = "../agent-semantic-tree-sitter" }
bytes = { workspace = true }
ignore = { workspace = true }
serde_json = { workspace = true }
memmap2.workspace = true
memchr = "2"
regex.workspace = true
regex-syntax.workspace = true
toml = { workspace = true }
tokio = { workspace = true }
tokio-stream.workspace = true
tantivy = { workspace = true, optional = true }
which = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
asp-rust-project-harness-policy = { workspace = true }

[dev-dependencies]
agent-semantic-provider-protocol = { path = "../agent-semantic-provider-protocol" }
[[test]]
name = "graph_owner_rank_report"
path = "tests/integration/graph_owner_rank_report/mod.rs"

[[test]]
name = "search_generation_segment"
path = "tests/unit/search_generation_segment.rs"
