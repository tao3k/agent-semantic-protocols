[package]
name = "agent-semantic-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Runtime state materialization for ASP project-local storage."

[dependencies]
agent-semantic-artifacts.workspace = true
agent-semantic-config = { path = "../agent-semantic-config" }
agent-semantic-content-identity.workspace = true
agent-semantic-provider-transport = { path = "../agent-semantic-provider-transport" }
blake3.workspace = true
bytes = "1"
fs2.workspace = true
gix = { workspace = true, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
  "status",
  "worktree-mutation",
] }
gix-config.workspace = true
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio.workspace = true
uuid = "1.23.4"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
asp-rust-project-harness-policy.workspace = true
