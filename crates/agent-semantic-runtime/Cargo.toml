[package]
name = "agent-semantic-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runtime state materialization for ASP project-local storage."

[dependencies]
agent-semantic-config = { path = "../agent-semantic-config" }
agent-semantic-provider-transport = { path = "../agent-semantic-provider-transport" }
blake3.workspace = true
bytes = "1"
gix = { workspace = true, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
  "status",
  "worktree-mutation",
] }
gix-config.workspace = true
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio.workspace = true
uuid = "1.23.4"

[dev-dependencies]
tempfile.workspace = true
