[workspace]

members = [
    "build-support/asp-rust-project-harness-policy",
    "crates/agent-semantic-artifacts",
    "crates/agent-semantic-config",
    "crates/agent-semantic-content-identity",
    "crates/agent-semantic-context-product",
    "crates/agent-semantic-runtime",
    "crates/agent-semantic-client",
    "crates/agent-semantic-client-protocol",
    "crates/agent-semantic-client-core",
    "crates/agent-semantic-client-db",
    "crates/agent-semantic-client-server",
    "crates/agent-semantic-runtime-server",
    "crates/agent-semantic-hook",
    "crates/agent-semantic-hook-testkit",
    "crates/agent-semantic-http-json",
    "crates/agent-semantic-loop",
    "crates/agent-semantic-provider-protocol",
    "crates/agent-semantic-provider-transport",
    "crates/agent-semantic-search",
    "crates/agent-semantic-search-projection",
    "crates/agent-semantic-schema-manager",
    "crates/agent-semantic-shell-parser",
    "crates/agent-semantic-tree-sitter",
]
exclude = ["languages/orgize", "languages/rust-lang-project-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.95"
license = "MIT"
edition = "2024"

[workspace.lints]

[workspace.dependencies]
arc-swap = "1.9.2"
memmap2 = "0.9.10"
agent-semantic-provider-protocol = { path = "crates/agent-semantic-provider-protocol" }
agent-semantic-provider-transport = { path = "crates/agent-semantic-provider-transport" }
agent-semantic-schema-manager = { path = "crates/agent-semantic-schema-manager" }
agent-semantic-runtime = { path = "crates/agent-semantic-runtime" }
agent-semantic-hook = { path = "crates/agent-semantic-hook" }
jsonschema = { version = "0.48.1", default-features = false }
referencing = "0.48.1"
aho-corasick = "1.1.5"
base64 = "0.23.1"
agent-semantic-content-identity = { path = "crates/agent-semantic-content-identity" }
agent-semantic-artifacts = { path = "crates/agent-semantic-artifacts" }
agent-semantic-http-json = { path = "crates/agent-semantic-http-json" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
parking_lot = "0.12.5"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = [
    "trace",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }

blake3 = "1"
bytes = "1"
criterion = "0.8.2"
figment = "0.10.19"
fs2 = "0.4"
fs4 = { version = "1", features = ["tokio"] }
gix = { version = "0.85.0", default-features = false, features = ["sha1"] }
gix-config = { version = "0.58.0", features = ["sha1", "sha256"] }
globset = "0.4.20"
ignore = { version = "0.4.26", features = ["simd-accel"] }
insta = "1"
orgize = { path = "languages/orgize", features = ["md"] }
proc-macro2 = "1"
libc = "0.2"
rust-lang-project-harness = { path = "languages/rust-lang-project-harness", default-features = false }
asp-rust-project-harness-policy = { path = "build-support/asp-rust-project-harness-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"
tonic-prost-build = "0.14.6"
postcard = { version = "1.1.3", features = ["alloc"] }
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
regex = "1.12.4"
tempfile = "3"
sha2 = "0.10"
streaming-iterator = "0.1"
syn = "2"
toml = "0.9"
tree-sitter = "0.26"
turso = { version = "0.7.2", default-features = false, features = ["fts", "sync"] }
which = "8"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 4
panic = "abort"
strip = true

[profile.dev]
incremental = true
opt-level = "s"
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 1
debug = false

# Workspace-owned Develop hot-path optimization. Member crates consume one
# root policy; no crate-local Cargo.toml owns optimization levels.
[profile.dev.package.tree-sitter]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.ignore]
opt-level = 2

[profile.dev.package.globset]
opt-level = 2

[profile.dev.package.aho-corasick]
opt-level = 2

[profile.dev.package.agent-semantic-config]
opt-level = 2

[profile.dev.package.agent-semantic-shell-parser]
opt-level = 2

[profile.dev.package.agent-semantic-hook]
opt-level = 2

[profile.dev.package.agent-semantic-client]
opt-level = 1
codegen-units = 16

# Hook microsecond SLO tests must execute representative optimized policy code;
# an unoptimized test artifact turns allocator/decoder debug overhead into a
# false production regression. The black-box limits remain unchanged.
[profile.test.package.agent-semantic-hook]
opt-level = 2

[profile.test.package.agent-semantic-client]
opt-level = 2
# The Client now owns the broad CLI composition surface. It must not inherit
# the removed Protocol crate's single-unit test linkage, which serialized every
# Hook composition fixture behind a 160MB binary link.
codegen-units = 16

[profile.dev-build]
inherits = "dev"
opt-level = 1
debug = false
strip = true
