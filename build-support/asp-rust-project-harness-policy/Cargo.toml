[package]
name = "asp-rust-project-harness-policy"
license.workspace = true
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
workspace-policy = ["dep:asp-rust"]

[dependencies]
blake3.workspace = true
asp-rust = { workspace = true, optional = true }
asp-rust-build-support.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "performance_verification"
harness = false
