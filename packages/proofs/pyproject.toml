[project]
name = "asp-proof-toolchain"
version = "0.1.0"
description = "Lean, AXLE, and proof-receipt audit toolchain for Agent Semantic Protocols"
requires-python = ">=3.13"
dependencies = [
  "axiom-axle==1.4.0",
  "jsonschema>=4.23,<5",
]

[project.scripts]
asp-axle-lean-audit = "asp_proof_toolchain.axle_lean_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asp_proof_toolchain"]
