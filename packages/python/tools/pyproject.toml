[project]
name = "agent-semantic-protocols-tools"
version = "0.1.0"
description = "Python tooling for Agent Semantic Protocols."
license = "Apache-2.0 AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "asp-python-graphs",
    "claude-code-sdk>=0.0.25",
    "jsonschema>=4.23,<5",
    "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv.sources]
asp-python-graphs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]
