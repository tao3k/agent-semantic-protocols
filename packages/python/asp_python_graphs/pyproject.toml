[project]
name = "asp-python-graphs"
version = "0.1.0"
description = "Resident Python graph algorithms managed by ASP Server."
license = "Apache-2.0 AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0.8,<2",
    "grpcio>=1.75,<2",
    "scipy>=1.14",
    "asp-memory-engine",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.uv.sources]
asp-memory-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asp_python_graphs"]
