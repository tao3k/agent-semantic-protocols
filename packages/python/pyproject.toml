[project]
name = "agent-semantic-protocols-python-workspace"
version = "0.1.0"
description = "Python workspace for Agent Semantic Protocols packages."
license = "Apache-2.0 AND LGPL-2.1-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "agent-semantic-protocols-tools",
    "asp-python-graphs",
    "asp-memory-engine",
    "asp-schema-manager",
]

[dependency-groups]
dev = [
    "asp-python",
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-semantic-protocols-tools = { workspace = true }
asp-python-graphs = { workspace = true }
asp-python = { path = "../../languages/asp-python", editable = true }
asp-memory-engine = { workspace = true }
asp-schema-manager = { workspace = true }

[tool.uv.workspace]
members = [
    "asp_python_graphs",
    "tools",
    "asp_memory_engine",
    "asp_schema_manager",
]
